name: Android debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: false
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Check resulting APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VocaLingua-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct APK download as pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.1.0-preview >/dev/null 2>&1 || gh release create v0.1.0-preview --target "$GITHUB_SHA" --title "VocaLingua v0.1.0 Preview" --notes "Early Android preview build. Debug-signed; use for testing, not production." --prerelease
          gh release upload v0.1.0-preview app/build/outputs/apk/debug/app-debug.apk --clobber
